   services:
     - type: web
       name: laudspeaker-backend
       env: node
       buildCommand: npm install && npm run build
       startCommand: npm start
       envVars:
         - key: NODE_ENV
           value: production
         - key: DATABASE_URL
           fromDatabase:
             name: laudspeaker-db
             property: connectionString
       plan: free

     - type: web
       name: laudspeaker-frontend
       env: node
       buildCommand: npm install && npm run build
       startCommand: npm start
       envVars:
         - key: REACT_APP_API_URL
           value: https://laudspeaker-backend.onrender.com
       plan: free

     - type: database
       name: laudspeaker-db
       databaseName: laudspeaker
       user: laudspeaker
       plan: free
